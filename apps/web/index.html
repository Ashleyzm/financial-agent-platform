<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>金融多智能体平台</title>
    <style>
      body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; background: #f4f7fb; color: #17324d; }
      main { max-width: 760px; margin: 80px auto; padding: 36px; background: white; border-radius: 14px; box-shadow: 0 12px 36px rgba(23,50,77,.08); }
      h1 { margin-top: 0; }
      .status { padding: 16px; background: #eaf2f8; border-radius: 8px; }
      code { color: #2166a5; }
    </style>
  </head>
  <body>
    <main>
      <p>FRAMEWORK v0.1</p>
      <h1>金融多智能体平台</h1>
      <p>当前阶段：W1 工程骨架与公共契约。</p>
      <div class="status" id="status">正在检查 API 服务...</div>
    </main>
    <script>
      fetch('/api/health')
        .then((response) => response.json())
        .then((data) => { document.querySelector('#status').textContent = `API 已连接 · ${data.version}`; })
        .catch(() => { document.querySelector('#status').textContent = 'API 暂未连接，请检查 Docker 服务。'; });
    </script>
  </body>
</html>
