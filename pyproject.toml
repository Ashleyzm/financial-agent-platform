[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-agent-platform"
version = "0.1.0"
description = "A traceable and extensible multi-agent platform for financial research."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "akshare>=1.18.91,<1.19",
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-postgres>=3.1,<4.0",
  "redis>=6.4,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages", "services"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
